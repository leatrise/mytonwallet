server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /tos {
        alias /usr/share/nginx/html/tos.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
