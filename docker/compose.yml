name: yohi-api

services:
  cloudflared:
    image: cloudflare/cloudflared:2025.8.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    env_file:
      - ${CLOUDFLARED_ENV_FILE:-/opt/yohi/secrets/cloudflared.env}
    depends_on:
      caddy:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    expose: ["80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend-api:
        condition: service_healthy
      ton-connect-bridge:
        condition: service_healthy
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  backend-api:
    build:
      context: ./backend-api
    image: yohi/backend-api:1.0.0
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/yohi/secrets/backend.env}
    environment:
      PORT: "3000"
      VALKEY_URL: redis://valkey:6379/0
    expose: ["3000"]
    depends_on:
      valkey:
        condition: service_healthy
    networks: [internal, outbound]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1G }

  # The upstream project publishes source rather than versioned images. The build
  # context is locked to its release pointer commit, so deployments are reproducible.
  ton-connect-bridge:
    build:
      context: https://github.com/ton-connect/bridge.git#bc97ab0a6d0d874a1e49344c6ae96252124fc923
      dockerfile: docker/Dockerfile.bridge3
    image: yohi/ton-connect-bridge:bc97ab0
    restart: unless-stopped
    environment:
      PORT: "8081"
      METRICS_PORT: "9103"
      STORAGE: memory
      CORS_ENABLE: "true"
      RPS_LIMIT: "20"
      CONNECTIONS_LIMIT: "50"
      MAX_BODY_SIZE: "65536"
      TON_ANALYTICS_ENABLED: "false"
      PPROF_ENABLED: "false"
      TRUSTED_PROXY_RANGES: "172.16.0.0/12"
    expose: ["8081", "9103"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9103/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  valkey:
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    expose: ["6379"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 640M }

networks:
  edge: {}
  outbound: {}
  internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
