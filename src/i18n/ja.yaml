$safety_rules_two: パスワードを忘れた場合、またはこのデバイスにアクセスできなくなった場合は、これらの単語を使用して**ウォレットを復元**できます。
$safety_rules_three: これらの言葉を持っている人は誰でもあなたの財布をコントロールできます。 **開発者やサポート スタッフを含む誰にも決して送信したり見せたりしないでください**。
